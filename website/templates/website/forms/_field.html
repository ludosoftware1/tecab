{% comment %}
Campo no formato do Contact Form 7.
Parâmetros: field, name (data-name), type, placeholder, extra_class, required (bool), attrs (atributos extras).
{% endcomment %}<span class="wpcf7-form-control-wrap" data-name="{{ name }}">{% if type == "textarea" %}<textarea cols="40" rows="1" class="wpcf7-form-control wpcf7-textarea{% if field.errors %} wpcf7-not-valid{% endif %}" aria-invalid="{{ field.errors|yesno:'true,false' }}" placeholder="{{ placeholder }}" name="{{ field.html_name }}">{{ field.value|default_if_none:'' }}</textarea>{% else %}<input size="40" class="wpcf7-form-control {{ extra_class }}{% if field.errors %} wpcf7-not-valid{% endif %}"{% if required %} aria-required="true"{% endif %} aria-invalid="{{ field.errors|yesno:'true,false' }}"{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if type != "file" %} value="{{ field.value|default_if_none:'' }}"{% endif %} type="{{ type }}" name="{{ field.html_name }}"{% if attrs %} {{ attrs|safe }}{% endif %} />{% endif %}{% for error in field.errors %}<span class="wpcf7-not-valid-tip" aria-hidden="true">{{ error }}</span>{% endfor %}</span>
