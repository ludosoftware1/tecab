<ul id="qodef-main-navigation-menu" class="menu">{% for item in menu_items %}<li class="{{ item.classes }}"><a href="{{ item.url }}"><span class="qodef-menu-item-inner"><span class="qodef-menu-item-text">{{ item.label }}</span></span></a>{% if item.children %}<span class="qodef-menu-arrow"></span>
<div class="qodef-drop-down-second"><div class="qodef-drop-down-second-inner"><ul class="sub-menu">
{% for child in item.children %}	<li class="{{ child.classes }}"><a href="{{ child.url }}"><span class="qodef-menu-item-inner"><span class="qodef-menu-item-text">{{ child.label }}</span></span></a></li>
{% endfor %}</ul></div></div>
{% endif %}</li>
{% endfor %}</ul>
