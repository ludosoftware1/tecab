<ul id="menu-principal" class="menu">{% for item in menu_items %}<li class="{{ item.classes }}"><a href="{{ item.url }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a>{% if item.children %}
<ul class="sub-menu">
{% for child in item.children %}	<li class="{{ child.classes }}"><a href="{{ child.url }}">{{ child.label }}</a></li>
{% endfor %}</ul>
{% endif %}</li>
{% endfor %}</ul>
